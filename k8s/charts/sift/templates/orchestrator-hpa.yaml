{{- if .Values.orchestrator.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sift.fullname" . }}-orchestrator
  labels:
    {{- include "sift.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sift.fullname" . }}-orchestrator
  minReplicas: {{ .Values.orchestrator.hpa.minReplicas }}
  maxReplicas: {{ .Values.orchestrator.hpa.maxReplicas }}
  metrics:
    - type: External
      external:
        metric:
          name: nats_consumer_lag
        target:
          type: Value
          value: {{ .Values.orchestrator.hpa.targetLag | quote }}
{{- end }}
